<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram - Feed</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="ig-top">
    <h1 class="ig-logo">Instagram</h1>
    <a href="login.html" class="logout">Log out</a>
  </header>

  <main class="ig-feed">

    <!-- Stories -->
    <section class="stories">
      <div class="story"><div class="ring"><span>Y</span></div>Your story</div>
      <div class="story"><div class="ring"><span>A</span></div>arun</div>
      <div class="story"><div class="ring"><span>P</span></div>priya</div>
      <div class="story"><div class="ring"><span>R</span></div>ravi</div>
      <div class="story"><div class="ring"><span>M</span></div>meena</div>
    </section>

    <!-- Post 1 -->
    <article class="ig-post">
      <div class="post-top">
        <div class="mini-avatar">A</div>
        <strong>arun_kumar</strong>
      </div>
      <div class="post-img c1">Sunset vibes 🌇</div>
      <div class="post-bar">
        <button class="heart-btn">♡</button>
        <button class="cmt-btn">💬</button>
        <button class="save-btn">🔖</button>
      </div>
      <p class="likes"><span class="like-count">128</span> likes</p>
      <p class="caption"><strong>arun_kumar</strong> Evening walk by the beach.</p>
      <div class="comments"></div>
      <input type="text" class="cmt-input" placeholder="Add a comment and press Enter...">
    </article>

    <!-- Post 2 -->
    <article class="ig-post">
      <div class="post-top">
        <div class="mini-avatar">P</div>
        <strong>priya_s</strong>
      </div>
      <div class="post-img c2">Coffee time ☕</div>
      <div class="post-bar">
        <button class="heart-btn">♡</button>
        <button class="cmt-btn">💬</button>
        <button class="save-btn">🔖</button>
      </div>
      <p class="likes"><span class="like-count">86</span> likes</p>
      <p class="caption"><strong>priya_s</strong> Rainy day, warm cup.</p>
      <div class="comments"></div>
      <input type="text" class="cmt-input" placeholder="Add a comment and press Enter...">
    </article>

  </main>

  <nav class="bottom-nav">
    <a href="feed.html" class="active">🏠<span>Home</span></a>
    <a href="profile.html">👤<span>Profile</span></a>
  </nav>

  <script src="script.js"></script>
</body>
</html>
