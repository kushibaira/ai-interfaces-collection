<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Summary Cards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">

    <header class="top">
      <h1>AI Summary Cards</h1>
      <button class="theme-btn" id="themeBtn">Toggle theme</button>
    </header>

    <!-- Input section -->
    <section class="input-card">
      <label for="sourceText">Paste text to summarize</label>
      <textarea id="sourceText" rows="6" placeholder="Paste an article, email or notes here..."></textarea>

      <div class="controls">
        <div class="length-toggle">
          <button class="length-btn active" data-length="short">Short</button>
          <button class="length-btn" data-length="detailed">Detailed</button>
        </div>
        <button class="sample-btn" id="sampleBtn">Use sample text</button>
        <button class="summarize-btn" id="summarizeBtn">Summarize</button>
      </div>
    </section>

    <!-- Summary card (hidden until summarized) -->
    <section class="summary-card" id="summaryCard">
      <div class="card-header">
        <span class="badge">AI Summary</span>
        <span class="confidence" id="confidence">Confidence: High</span>
      </div>

      <p class="summary-text" id="summaryText"></p>

      <button class="toggle-points" id="togglePoints">Hide key points</button>
      <ul class="key-points" id="keyPoints"></ul>

      <div class="card-actions">
        <button id="copyBtn">Copy</button>
        <button id="regenBtn">Regenerate</button>
        <button id="likeBtn" title="Good summary">👍</button>
        <button id="dislikeBtn" title="Bad summary">👎</button>
        <span class="feedback" id="feedback"></span>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
