<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat with Sidebar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- Sidebar: conversation history -->
    <aside class="sidebar" id="sidebar">
      <button class="new-chat-btn" id="newChatBtn">+ New chat</button>

      <p class="sidebar-title">Recent</p>
      <ul class="history-list" id="historyList">
        <li class="history-item active">Welcome chat</li>
        <li class="history-item">Plan my study week</li>
        <li class="history-item">Explain CSS grid</li>
      </ul>

      <button class="theme-btn" id="themeBtn">Toggle theme</button>
    </aside>

    <!-- Main chat area -->
    <main class="chat">
      <header class="chat-header">
        <button class="menu-btn" id="menuBtn">☰</button>
        <h1 class="chat-title">AI Assistant</h1>
      </header>

      <div class="messages" id="messages">
        <div class="welcome" id="welcome">
          <h2>How can I help you today?</h2>
          <div class="suggestions">
            <button class="chip">Explain a topic simply</button>
            <button class="chip">Write a short email</button>
            <button class="chip">Give me study tips</button>
          </div>
        </div>
      </div>

      <div class="input-area">
        <input type="text" id="userInput" placeholder="Type your message...">
        <button id="sendBtn">Send</button>
      </div>
    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
