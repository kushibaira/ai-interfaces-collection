<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MobiKwik - Recharge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <h1 class="brand">MobiKwik</h1>
    <span class="hello" id="topBalance"></span>
  </header>

  <main class="container">

    <section class="card">
      <h3>Pay bills and recharge</h3>

      <div class="type-tabs">
        <button class="type-btn active" data-type="Mobile recharge">📱 Mobile</button>
        <button class="type-btn" data-type="Electricity bill">💡 Electricity</button>
        <button class="type-btn" data-type="DTH recharge">📺 DTH</button>
      </div>

      <label class="field-label" for="number">Number / Consumer ID</label>
      <input type="text" id="number" class="field" placeholder="Enter number">

      <label class="field-label" for="payAmount">Amount (₹)</label>
      <input type="number" id="payAmount" class="field" placeholder="Enter amount" min="1">

      <div class="quick-amounts">
        <button class="amt-chip" data-amt="199">₹199</button>
        <button class="amt-chip" data-amt="299">₹299</button>
        <button class="amt-chip" data-amt="499">₹499</button>
      </div>

      <p class="pay-msg" id="payMsg"></p>
      <button class="pay-btn" id="payBtn">Pay now</button>
    </section>

  </main>

  <nav class="bottom-nav">
    <a href="home.html">🏠<span>Home</span></a>
    <a href="recharge.html" class="active">📱<span>Recharge</span></a>
    <a href="history.html">🧾<span>History</span></a>
  </nav>

  <script src="script.js"></script>
</body>
</html>
